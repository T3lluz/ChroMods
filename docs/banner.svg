<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" fill="none" role="img" aria-label="ChroMods">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="920" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#201e28"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.88" cy="0.12" r="0.55" gradientUnits="objectBoundingBox">
      <stop stop-color="#ff7a52" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.08" cy="0.92" r="0.5" gradientUnits="objectBoundingBox">
      <stop stop-color="#ff4f6e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4f6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="120" y1="80" x2="820" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd9c4"/>
      <stop offset="0.45" stop-color="#ff8f6b"/>
      <stop offset="1" stop-color="#ff4f6e"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="196" y1="118" x2="620" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6f1"/>
      <stop offset="0.55" stop-color="#ffd9c4"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.7" fill="rgba(255,255,255,0.09)"/>
    </pattern>
    <clipPath id="frame">
      <rect width="960" height="320" rx="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="320" fill="url(#bg)"/>
    <rect width="960" height="320" fill="url(#orbA)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="960" height="320" fill="url(#orbB)">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="7.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="820" cy="36" r="150" fill="#ff7a52" opacity="0.22" filter="url(#soft)">
      <animate attributeName="opacity" values="0.12;0.3;0.12" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="290" r="120" fill="#ff4f6e" opacity="0.16" filter="url(#soft)">
      <animate attributeName="opacity" values="0.1;0.22;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect width="960" height="320" fill="url(#dots)" opacity="0.55"/>
    <rect x="1" y="1" width="958" height="318" rx="35" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  </g>

  <g transform="translate(56,96)">
    <g filter="url(#glow)">
      <rect width="112" height="112" rx="26" fill="#1c1a24"/>
      <rect width="112" height="112" rx="26" fill="url(#orbA)" opacity="0.7"/>
      <rect x="0.7" y="0.7" width="110.6" height="110.6" rx="25.3" stroke="rgba(255,255,255,0.16)" stroke-width="1.4"/>
      <g transform="translate(8,8) scale(0.75)">
        <path d="M88.34 39.45 A36 36 0 1 0 88.34 88.55" stroke="url(#accent)" stroke-width="34" stroke-linecap="butt"/>
        <rect x="82" y="37" width="40" height="15" rx="7.5" fill="#ffd9c4"/>
        <rect x="76" y="56.5" width="40" height="15" rx="7.5" fill="#ff8f6b"/>
        <rect x="70" y="76" width="40" height="15" rx="7.5" fill="#ff4f6e"/>
      </g>
    </g>
  </g>

  <text x="196" y="148" fill="url(#wordmark)" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-1.6">ChroMods</text>
  <text x="198" y="188" fill="rgba(236,236,241,0.72)" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500">Chromium theming mods  glass, blur, quieter chrome</text>
  <text x="198" y="228" fill="rgba(255,143,107,0.9)" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.4">YouTube · GitHub · Google · DuckDuckGo</text>
</svg>
