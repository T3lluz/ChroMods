<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Theming</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="logo-container">
          <img src="../icons/icon48.png" alt="" class="logo-img" width="32" height="32" />
          <div class="title-wrap">
            <h1 class="app-title">YouTube Theming</h1>
            <p class="subtitle">Visual tweaks for youtube.com</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="version-pill" id="version-pill">v1.0.0</span>
          <button id="reload" class="reload-btn" type="button" title="Reload YouTube tab">
            Reload page
          </button>
        </div>
      </header>

      <main class="app-content">
        <section class="master-toggle card">
          <div class="toggle-row">
            <div>
              <h2>Enable theming</h2>
              <p>Turn all mods on or off for YouTube</p>
            </div>
            <label class="switch" aria-label="Enable theming">
              <input type="checkbox" id="master-toggle" checked />
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <section class="features-section">
          <div class="section-header">
            <h3 class="section-title">Features</h3>
            <span class="feature-count" id="feature-count">6 enabled</span>
          </div>
          <div id="features-list" class="features-list"></div>
        </section>

        <footer class="app-footer">
          <p>Styles adapted from <a href="https://github.com/sameerasw/my-internet" target="_blank" rel="noreferrer">my-internet</a></p>
        </footer>
      </main>
    </div>
    <script src="icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
