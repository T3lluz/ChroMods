<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChroMods</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container" id="app">
      <header class="app-header">
        <div class="header-fade" aria-hidden="true">
          <div class="header-frost">
            <div class="header-frost-dots"></div>
          </div>
          <div class="header-glass"></div>
        </div>
        <div class="header-top">
          <div class="logo-container">
            <img src="../icons/icon48.png" alt="" class="logo-img" width="32" height="32" />
            <div class="title-wrap">
              <h1 class="app-title">ChroMods</h1>
              <span class="version-pill" id="version-pill">v1.0.0</span>
            </div>
          </div>
          <div class="header-actions">
            <button
              id="theme-toggle"
              class="theme-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Force dark mode"
              title="Force dark mode on this site"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                  <mask id="chromods-moon-cut">
                    <rect width="24" height="24" fill="white" />
                    <circle class="theme-cut" cx="12" cy="12" r="6" fill="black" />
                  </mask>
                </defs>
                <circle class="theme-core" cx="12" cy="12" r="6" mask="url(#chromods-moon-cut)" />
                <g class="theme-rays">
                  <line x1="12" y1="1.75" x2="12" y2="3.75" />
                  <line x1="12" y1="20.25" x2="12" y2="22.25" />
                  <line x1="1.75" y1="12" x2="3.75" y2="12" />
                  <line x1="20.25" y1="12" x2="22.25" y2="12" />
                  <line x1="4.35" y1="4.35" x2="5.75" y2="5.75" />
                  <line x1="18.25" y1="18.25" x2="19.65" y2="19.65" />
                  <line x1="18.25" y1="5.75" x2="19.65" y2="4.35" />
                  <line x1="4.35" y1="19.65" x2="5.75" y2="18.25" />
                </g>
              </svg>
            </button>
            <button id="reload" class="reload-btn" type="button" title="Reload this page">
              Reload page
            </button>
          </div>
        </div>
        <nav id="site-rail" class="site-rail" aria-label="Supported sites"></nav>
      </header>

      <section id="current-pane" class="current-pane"></section>

      <section class="other-sites" aria-label="Other sites">
        <div class="section-header other-sites-header">
          <h3 class="section-title" id="other-sites-title">Other sites</h3>
        </div>
        <div id="other-sites-list" class="other-sites-list"></div>
      </section>

      <footer class="app-footer">
        <p>Styles adapted from <a href="https://github.com/sameerasw/my-internet" target="_blank" rel="noreferrer">my-internet</a></p>
      </footer>
    </div>
    <script src="../scripts/sites.js"></script>
    <script src="../scripts/icons.js"></script>
    <script src="../scripts/dark-sites.js"></script>
    <script src="../scripts/style-request.js"></script>
    <script src="../scripts/popup.js"></script>
  </body>
</html>
